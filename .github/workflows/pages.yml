# main 브랜치에 push 하면 GitHub Pages 로 자동 배포 (빌드 단계 없음: 저장소 그대로가 웹사이트)
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: 배포할 파일만 모으기
        run: |
          mkdir _site
          cp -r index.html js vendor _site/
      - name: 캐시 무효화 (배포마다 스크립트 주소에 버전 붙이기 → 옛 파일과 섞이지 않음)
        run: |
          V=${GITHUB_SHA::8}
          find _site/js -name '*.js' -exec perl -pi -e "s#((?:from|import\()\s*'\.\.?/[^']+?\.js)'#\$1?v=$V'#g" {} +
          perl -pi -e "s#js/main\.js#js/main.js?v=$V#" _site/index.html
          grep -c "?v=$V" _site/js/main.js _site/index.html
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
