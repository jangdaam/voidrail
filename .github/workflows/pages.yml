# main 브랜치에 push 하면 GitHub Pages 로 자동 배포 (빌드 단계 없음: 저장소 그대로가 웹사이트)
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v4
        with: { ref: city, path: _city }
      - name: 배포할 파일만 모으기 (기존 버전 = 루트, 지하 도시 프로토타입 = /city/)
        run: |
          mkdir -p _site/city
          cp -r index.html js vendor _site/
          cp -r _city/index.html _city/js _city/vendor _site/city/
      - name: 캐시 무효화 (배포마다 스크립트 주소에 버전 붙이기 → 옛 파일과 섞이지 않음)
        run: |
          V=${GITHUB_SHA::6}$(git -C _city rev-parse --short=6 HEAD)
          for D in _site _site/city; do
            find $D/js -name '*.js' -exec perl -pi -e "s#((?:from|import\()\s*'\.\.?/[^']+?\.js)'#\$1?v=$V'#g" {} +
            perl -pi -e "s#js/main\.js#js/main.js?v=$V#" $D/index.html
          done
          grep -c "?v=$V" _site/js/main.js _site/index.html _site/city/js/main.js _site/city/index.html
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
